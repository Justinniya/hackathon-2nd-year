<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Segoe UI', Arial, sans-serif;
    background: linear-gradient(135deg, #4f46e5, #0ea5e9);
  }
  .login-card {
    background: #ffffff;
    width: 100%;
    max-width: 360px;
    padding: 40px 32px;
    border-radius: 12px;
    box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
  }
  .login-card h1 {
    margin: 0 0 8px;
    font-size: 24px;
    color: #1e293b;
    text-align: center;
  }
  .login-card p.subtitle {
    margin: 0 0 24px;
    font-size: 14px;
    color: #64748b;
    text-align: center;
  }
  .field {
    margin-bottom: 18px;
  }
  .field label {
    display: block;
    margin-bottom: 6px;
    font-size: 13px;
    color: #334155;
    font-weight: 600;
  }
  .field input {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid #cbd5e1;
    border-radius: 8px;
    font-size: 14px;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .field input:focus {
    outline: none;
    border-color: #4f46e5;
    box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
  }
  .options {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
    font-size: 13px;
  }
  .options label {
    display: flex;
    align-items: center;
    gap: 6px;
    color: #475569;
  }
  .options a {
    color: #4f46e5;
    text-decoration: none;
  }
  .options a:hover {
    text-decoration: underline;
  }
  button.submit {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 8px;
    background: #4f46e5;
    color: #fff;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s;
  }
  button.submit:hover {
    background: #4338ca;
  }
  .divider {
    display: flex;
    align-items: center;
    margin: 20px 0;
    color: #94a3b8;
    font-size: 12px;
  }
  .divider::before,
  .divider::after {
    content: "";
    flex: 1;
    height: 1px;
    background: #e2e8f0;
  }
  .divider span {
    margin: 0 10px;
  }
  .signup {
    text-align: center;
    font-size: 13px;
    color: #64748b;
  }
  .signup a {
    color: #4f46e5;
    font-weight: 600;
    text-decoration: none;
  }
  .signup a:hover {
    text-decoration: underline;
  }
</style>
</head>
<body>
  <div class="login-card">
    <h1>Welcome Back</h1>
    <p class="subtitle">Sign in to continue</p>
    <form id="loginForm">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="you@example.com" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="••••••••" required>
      </div>
      <div class="options">
        <label>
          <input type="checkbox" name="remember">
          Remember me
        </label>
        <a href="#">Forgot password?</a>
      </div>
      <button type="submit" class="submit">Log In</button>
    </form>
    <div class="divider"><span>OR</span></div>
    <p class="signup">Don't have an account? <a href="#">Sign up</a></p>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', function (e) {
      e.preventDefault();
      alert('Login submitted (demo only — connect to backend to authenticate).');
    });
  </script>
</body>
</html>
